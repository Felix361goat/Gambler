<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Beat Orders</title>
  <meta name="description" content="Aufträge für Beats, Songs und Vocal Chains." />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Orders" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>

  <main id="view" class="view"></main>

  <div id="miniplayer" class="miniplayer glass" hidden></div>

  <nav class="tabbar glass" role="tablist">
    <button class="tab" data-tab="orders" role="tab">
      <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10" /></svg>
      <span>Aufträge</span><i class="badge" id="tabBadge" hidden></i>
    </button>
    <button class="tab" data-tab="library" role="tab">
      <svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12" /><circle cx="6" cy="18" r="3" /><circle cx="17" cy="16" r="3" /></svg>
      <span>Bibliothek</span>
    </button>
    <button class="tab" data-tab="lexikon" role="tab">
      <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z" /><path d="M4 19V5M8 7h7M8 11h5" /></svg>
      <span>Lexikon</span>
    </button>
    <button class="tab" data-tab="career" role="tab">
      <svg viewBox="0 0 24 24"><path d="M4 20l5-6 4 3 7-9" /><path d="M15 8h5v5" /></svg>
      <span>Karriere</span>
    </button>
    <button class="tab" data-tab="profile" role="tab">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" /></svg>
      <span>Profil</span>
    </button>
  </nav>

  <div id="sheetLayer" class="sheet-layer" hidden>
    <div class="sheet-dim" data-action="close-sheet"></div>
    <section id="sheet" class="sheet glass-strong" role="dialog" aria-modal="true"></section>
  </div>

  <div id="viz" class="viz" hidden><canvas id="vizCanvas"></canvas><div id="vizUi" class="viz-ui"></div></div>

  <div id="toast" class="toast glass" hidden></div>
  <input id="filePicker" type="file" hidden />
  <audio id="audio" preload="metadata" playsinline></audio>

  <script>
    // Safety net: if the app can't start, show why instead of an empty screen.
    (function () {
      var errs = [];
      function show(extra) {
        var v = document.getElementById('view');
        if (!v || (v.children.length && !extra)) return;
        v.innerHTML = '<div class="empty glass" style="text-align:left"><div class="big">🛠️</div><h3>Beim Starten ist etwas schiefgelaufen</h3>' +
          '<p>Mach bitte einen Screenshot davon und schick ihn Claude.</p><pre style="white-space:pre-wrap;font-size:12px;opacity:.8">' +
          ('Schritt: ' + (window.__bootStage || 'laden') + '\n' + errs.join('\n')).replace(/[<&]/g, function (c) { return c === '<' ? '&lt;' : '&amp;'; }) +
          '</pre><button class="btn small" onclick="location.reload()">Neu laden</button></div>';
      }
      window.__bootError = function (e) { errs.push(String((e && (e.stack || e.message)) || e).slice(0, 600)); show(true); };
      window.addEventListener('error', function (e) { errs.push((e.message || 'Fehler') + ' @ ' + (e.filename || '').split('/').pop() + ':' + (e.lineno || '')); });
      window.addEventListener('unhandledrejection', function (e) { var r = e.reason; errs.push('Promise: ' + String((r && (r.stack || r.message)) || r).slice(0, 400)); });
      setTimeout(function () { show(false); }, 6000);
    })();
  </script>
  <script type="module" src="js/app.js" onerror="window.__bootError && window.__bootError('app.js konnte nicht geladen werden')"></script>
</body>
</html>
